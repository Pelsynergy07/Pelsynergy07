<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <clipPath id="c"><rect width="600" height="380" rx="24"/></clipPath>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4D8D"/><stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="600" height="380" fill="#16121C"/>
    <g fill="url(#bar)">
      <rect x="60"  y="110" width="14" height="60" rx="7"><animate attributeName="height" values="20;90;30;70;20" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="130;95;125;105;130" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="88"  y="110" width="14" height="60" rx="7"><animate attributeName="height" values="60;20;100;40;60" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="110;130;90;120;110" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="116" y="110" width="14" height="60" rx="7"><animate attributeName="height" values="100;40;70;120;100" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="90;120;105;80;90" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="144" y="110" width="14" height="60" rx="7"><animate attributeName="height" values="40;110;60;20;40" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="120;85;110;130;120" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="172" y="110" width="14" height="60" rx="7"><animate attributeName="height" values="80;30;120;60;80" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="100;125;80;110;100" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="200" y="110" width="14" height="60" rx="7"><animate attributeName="height" values="30;90;50;100;30" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="125;95;115;90;125" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="228" y="110" width="14" height="60" rx="7"><animate attributeName="height" values="70;20;80;40;70" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="105;130;100;120;105" dur="1.0s" repeatCount="indefinite"/></rect>
      <rect x="256" y="110" width="14" height="60" rx="7"><animate attributeName="height" values="20;60;30;80;20" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="130;110;125;100;130" dur="1.4s" repeatCount="indefinite"/></rect>
    </g>
    <!-- speech becomes text -->
    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#ffffff">
      <text x="310" y="118" fill-opacity="0.45">"uh so like, make the</text>
      <text x="310" y="140" fill-opacity="0.45">button pop more?"</text>
      <text x="310" y="176" fill="#FFB547">→ Make the button</text>
      <text x="310" y="198" fill="#FFB547">  stand out more.</text>
    </g>
    <text x="40" y="52" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#ffffff" fill-opacity="0.55">01 — VOICE</text>
    <text x="40" y="290" font-family="'Helvetica Neue','Inter','Segoe UI',Arial,sans-serif" font-weight="900" font-size="54" letter-spacing="-2.5" fill="#ffffff">FlowState</text>
    <text x="40" y="326" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#ffffff" fill-opacity="0.75">talk, don't type. it writes for you.</text>
  </g>
</svg>
