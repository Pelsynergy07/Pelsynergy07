<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <clipPath id="c"><rect width="600" height="380" rx="24"/></clipPath>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
  </defs>
  <g clip-path="url(#c)">
    <rect width="600" height="380" fill="#05070F"/>
    <g filter="url(#soft)" opacity="0.8">
      <ellipse cx="420" cy="160" rx="170" ry="90" fill="#6D5BFF"><animate attributeName="cx" values="420;360;440;420" dur="12s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="300" cy="230" rx="150" ry="70" fill="#2EE6C5" opacity="0.7"><animate attributeName="cy" values="230;200;250;230" dur="9s" repeatCount="indefinite"/></ellipse>
    </g>
    <!-- plankton -->
    <g fill="#B9FFF3" filter="url(#glow)">
      <circle cx="120" cy="90" r="2.5"><animate attributeName="cy" values="90;70;90" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="140" r="3"><animate attributeName="cy" values="140;115;140" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="80" r="2"><animate attributeName="cy" values="80;100;80" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="110" r="3.5"><animate attributeName="cy" values="110;85;110" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;1;.4" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="530" cy="180" r="2.5"><animate attributeName="cy" values="180;160;180" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="390" cy="200" r="2"><animate attributeName="cy" values="200;225;200" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="270" cy="60" r="1.8"><animate attributeName="opacity" values="1;.1;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="500" cy="60" r="2.2"><animate attributeName="opacity" values=".1;1;.1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="190" r="2"><animate attributeName="cy" values="190;170;190" dur="7s" repeatCount="indefinite"/></circle>
    </g>
    <!-- waves -->
    <g fill="none" stroke="#2EE6C5" stroke-opacity="0.35" stroke-width="1.5">
      <path d="M0 230 Q 75 210 150 230 T 300 230 T 450 230 T 600 230 T 750 230"><animateTransform attributeName="transform" type="translate" values="0 0;-150 0" dur="6s" repeatCount="indefinite"/></path>
      <path d="M0 245 Q 75 228 150 245 T 300 245 T 450 245 T 600 245 T 750 245" stroke="#6D5BFF"><animateTransform attributeName="transform" type="translate" values="-150 0;0 0" dur="8s" repeatCount="indefinite"/></path>
    </g>
    <text x="40" y="52" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#ffffff" fill-opacity="0.55">02 — PORTFOLIO</text>
    <text x="40" y="290" font-family="'Helvetica Neue','Inter','Segoe UI',Arial,sans-serif" font-weight="900" font-size="54" letter-spacing="-2.5" fill="#ffffff">The Vault</text>
    <text x="40" y="326" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#ffffff" fill-opacity="0.75">my experiments, floating in a glowing sea.</text>
  </g>
</svg>
